name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Go API (vet, tests, formatting)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./api

  addon:
    name: Addon (type-check, fixtures, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # version comes from the packageManager field in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Hermetic gates: type-check, the fixture engine (same math as the Go
      # API), and the production build — which MUST terminate (the job
      # timeout is the hang detector).
      - run: pnpm type-check
      - run: pnpm test
      - run: pnpm build
